model:
  model_id: openai/whisper-small
  torch_dtype: float16
  device_map: auto
  architecture: whisper
dataset:
  dataset_id: google/WaxalNLP
  languages:
  - lug
  - lin
  - sna
  sample_rate: 16000
  streaming: false
  format_batch_size: 32
prompts:
  system_message: You are an assistant that transcribes speech accurately.
  user_message: Please transcribe this audio.
lora:
  task_type: CAUSAL_LM
  r: 0
  alpha: 16
  dropout: 0.0
  target_modules:
  - v_proj
  - o_proj
  bias: none
  use_rslora: false
  use_dora: false
training:
  output_dir: ./experiments/baseline_v2/checkpoints
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 5.0e-06
  max_steps: 50
  max_seq_length: 225
  eval_steps: 50
  logging_steps: 10
  save_steps: 50
  num_validation_examples: 200
  shuffle_buffer_size: 1000
  dataloader_num_workers: 2
  packing: false
  report_to: none
  num_train_epochs: 3
  fp16: true
  bf16: false
evaluation:
  num_samples: 30
  batch_size: 4
  max_new_tokens: 225
inference:
  max_new_tokens: 225
  temperature: 1.0
  do_sample: false
  num_beams: 1
  length_penalty: 1.0
experiment:
  enabled: true
  base_dir: ./experiments
  name: baseline_v2
  notes: "Whisper Small, 3 epochs, lr=5e-6, grad_accum=8 \u2014 improved baseline"
  save_predictions: true
  save_training_log: true
  generate_plots: true
  generate_html_report: true
logging:
  colored: true
  log_gpu_memory_every_n_steps: 50
  log_dataset_stats: true
  log_eta: true
wandb:
  project: waxal-asr
  entity: null
  tags: []
tensorboard:
  log_dir: null
seed: 42
submission:
  test_csv: ./Test.csv
  sample_submission_csv: ./SampleSubmission.csv
  output_path: ./submission.csv
