# =============================================================================
# Experiment: baseline_v2 — Improved baseline
# =============================================================================
# Whisper Small, 3 epochs, lower learning rate, mixed precision,
# gradient accumulation. Everything else identical to v1.
# Goal: improve over baseline_v1 through longer training and tuned LR.
# =============================================================================

model:
  model_id: "openai/whisper-small"
  torch_dtype: "float16"
  device_map: "auto"
  architecture: "whisper"

dataset:
  languages:
    - "lug"
    - "lin"
    - "sna"
  streaming: false

lora:
  r: 0

training:
  output_dir: "./experiments/baseline_v2/checkpoints"
  num_train_epochs: 3
  max_steps: 50
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 5.0e-6
  logging_steps: 10
  save_steps: 50
  eval_steps: 50
  max_seq_length: 225
  fp16: true
  bf16: false
  report_to: "none"

evaluation:
  num_samples: 30
  batch_size: 4
  max_new_tokens: 225

inference:
  max_new_tokens: 225
  num_beams: 1
  length_penalty: 1.0

experiment:
  name: "baseline_v2"
  notes: "Whisper Small, 3 epochs, lr=5e-6, grad_accum=8 — improved baseline"
