# =============================================================================
# Experiment: baseline_v1 — Fast sanity check
# =============================================================================
# Whisper Small, 1 epoch, default preprocessing, greedy decoding.
# Goal: verify the pipeline works end-to-end and establish a baseline WER.
# =============================================================================

model:
  model_id: "openai/whisper-small"
  torch_dtype: "float16"
  device_map: "auto"
  architecture: "whisper"

dataset:
  languages:
    - "lug"
    - "lin"
    - "sna"

lora:
  r: 0  # No LoRA — full fine-tuning for baseline

training:
  output_dir: "./experiments/baseline_v1/checkpoints"
  num_train_epochs: 1
  max_steps: -1
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  learning_rate: 1.0e-5
  logging_steps: 25
  save_steps: 500
  eval_steps: 500
  max_seq_length: 225
  fp16: true
  bf16: false
  report_to: "none"

evaluation:
  num_samples: 200
  batch_size: 4
  max_new_tokens: 225

inference:
  max_new_tokens: 225
  num_beams: 1
  length_penalty: 1.0

experiment:
  name: "baseline_v1"
  notes: "Whisper Small, 1 epoch, greedy decoding — sanity check"
